version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gwent-bot-db
    environment:
      POSTGRES_DB: gwent_bot
      POSTGRES_USER: gwent_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gwent_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwent_user -d gwent_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gwent-network

  redis:
    image: redis:7-alpine
    container_name: gwent-bot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gwent-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gwent-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8080}
      DATABASE_URL: postgres://gwent_user:${DB_PASSWORD:-gwent_password}@postgres:5432/gwent_bot?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      START_WORD: ${START_WORD:-gwentstart}
      DAILY_COIN_WORD: ${DAILY_COIN_WORD:-goldmine}
      AXE_WORD: ${AXE_WORD:-sharpaxe}
      DAILY_COIN_COOLDOWN_MINUTES: ${DAILY_COIN_COOLDOWN_MINUTES:-5}
      AXE_COOLDOWN_HOURS: ${AXE_COOLDOWN_HOURS:-1}
      STARTING_GOLD: ${STARTING_GOLD:-100}
      STARTING_LEVEL: ${STARTING_LEVEL:-1}
      CHEST_CARDS_LEVEL_1: ${CHEST_CARDS_LEVEL_1:-5}
      CHEST_CARDS_LEVEL_2: ${CHEST_CARDS_LEVEL_2:-3}
      MINE_GOLD_PER_EXTRACT: ${MINE_GOLD_PER_EXTRACT:-50}
      MINE_MAX_EXTRACTS: ${MINE_MAX_EXTRACTS:-10}
      AXE_DURABILITY: ${AXE_DURABILITY:-10}
      RARITY_COMMON_WEIGHT: ${RARITY_COMMON_WEIGHT:-50}
      RARITY_RARE_WEIGHT: ${RARITY_RARE_WEIGHT:-30}
      RARITY_EPIC_WEIGHT: ${RARITY_EPIC_WEIGHT:-15}
      RARITY_LEGENDARY_WEIGHT: ${RARITY_LEGENDARY_WEIGHT:-5}
      NATIONS: ${NATIONS:-Northern Realms,Nilfgaard,Scoia'tael,Monsters,Syndicate}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gwent-network

volumes:
  postgres_data:
  redis_data:

networks:
  gwent-network:
    driver: bridge
